function renderUp(all) {
  const list = all ? up : up.slice(0, 5);
  $('#calBox').innerHTML = up.length ? `<div class="rows">${list.map(calRow).join('')}</div>` + (up.length > 5 && !all ? '<button class="more-btn" id="moreEv">看看更多活動 ▾</button>' : '') : '<div class="empty">目前沒有預告中的團購</div>';
  const mb = $('#moreEv'); if (mb) mb.onclick = () => renderUp(true);
}
renderUp(false);
document.addEventListener('click', ev => { if (ev.target.closest('[data-remind]')) toast('請在跳出的畫面按「加入」，開團那天早上會提醒你'); });

/* ── 限時團購中（卡片，只顯示「開團中」） ── */
const nowEv = D.events.filter(e => e.start <= todayIso && todayIso <= e.end);
const usedUrls = new Set(nowEv.map(e => e.link).filter(Boolean));
const card = e => `<div class="deal"><div class="ph">${e.cover ? `<img src="${esc(e.cover)}" alt="${esc(e.title)}" loading="lazy">` : `<span class="ini serif">${esc(e.title.trim().charAt(0))}</span>`}</div>
  <div class="bd"><div class="t">${esc(e.title)}</div><span class="pill">開團中</span>
  ${e.link ? `<a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">前往購買 →</a>` : `<a class="btn off">連結整理中</a>`}</div></div>`;
const feat = D.shop.filter(l => l.featured && !l.ended && !usedUrls.has(l.url)).sort((a, b) => (a.feat_order || 0) - (b.feat_order || 0)).map(l => ({ title: l.name, link: l.url, cover: l.cover }));
const allCards = nowEv.concat(feat);
$('#nowBox').innerHTML = allCards.length ? `<div class="grid2">${allCards.map(card).join('')}</div>` : '<div class="empty">目前沒有進行中的限時團購<br>看看上方「團購行事曆」或下方「長期團購」</div>';

const longList = D.shop.filter(l => !l.ended && !l.featured && l.section !== 'official' && !usedUrls.has(l.url));
const officialList = D.shop.filter(l => !l.ended && l.section === 'official');
if (longList.length) { $('#long').hidden = false; $('#longBox').innerHTML = longList.map(l => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="n">${esc(l.name)}</span><span class="go">前往 →</span></a>`).join(''); }
const offCard = l => `<div class="deal"><div class="ph">${l.cover ? `<img src="${esc(l.cover)}" alt="${esc(l.name)}" loading="lazy">` : `<span class="ini serif">${esc(l.name.trim().charAt(0))}</span>`}</div>
  <div class="bd"><div class="t">${esc(l.name)}</div><span class="pill">官網販售</span><a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">前往官網 →</a></div></div>`;
if (officialList.length) { $('#official').hidden = false; $('#officialBox').innerHTML = `<div class="grid2">${officialList.map(offCard).join('')}</div>`; }

const endedList = D.shop.filter(l => l.ended);
if (endedList.length) { $('#ended').hidden = false; $('#endedBox').innerHTML = endedList.map(l => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="n">${esc(l.name)}</span><span class="go">已結團・找客服 →</span></a>`).join(''); }
$('#inf').onclick = () => $('#infNote').classList.toggle('on');

const find = k => D.social.find(s => s.name.includes(k));
const jl = find('社群'), ji = find('Instagram');
$('#joinBox').innerHTML = (jl ? `<a class="l" href="${esc(jl.url)}" target="_blank" rel="noopener">LINE 社群</a>` : '') + (ji ? `<a class="i" href="${esc(ji.url)}" target="_blank" rel="noopener">Instagram</a>` : '');
if (D.more.length) { $('#more').hidden = false; $('#moreBox').innerHTML = D.more.map(l => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="n">${esc(l.name)}</span><span class="go">前往 →</span></a>`).join(''); }
$('#foot').innerHTML = `廠商合作：<a href="mailto:${esc(D.profile.email)}">${esc(D.profile.email)}</a><br>© ${new Date().getFullYear()} Avolala　資料更新：${esc(D.built)}`;

const menu = $('#menu');
$('#mb').onclick = () => menu.classList.add('on'); $('#mx').onclick = () => menu.classList.remove('on');
menu.onclick = e => { if (e.target === menu || e.target.tagName === 'A') menu.classList.remove('on'); };
let tt; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 3800); }
</script>
</body>
</html>
