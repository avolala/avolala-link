<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVOLALA育兒頻道｜團購連結</title>
<meta name="description" content="Avolala 團購連結、開團檔期、已結團客服資訊">
<meta property="og:title" content="AVOLALA育兒頻道｜團購連結">
<meta property="og:image" content="assets/logo.png">
<style>
:root{--bg:#f7f1e8;--card:#fffdf9;--ink:#4b3f38;--muted:#9b8d83;--line:#e9dccd;--rose:#e3b8a6;--butter:#efdcae;--slate:#9fb3ba;--terra:#c97b5d;--terra-d:#b46a4d;--pill:#f6e8bd;--shadow:0 8px 24px rgba(120,86,64,.10)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.serif{font-family:"Noto Serif TC","Songti TC","Hiragino Mincho ProN","PMingLiU",serif}
.wrap{max-width:480px;margin:0 auto;padding:0 16px;overflow-x:clip}
.cover{position:relative;height:210px;background:linear-gradient(180deg,#efe2d2,#f4e9db);overflow:hidden;margin:0 -16px}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.avatar{display:block;width:108px;height:108px;margin:-54px auto 0;position:relative;border-radius:50%;border:4px solid #fff;background:#fff;box-shadow:var(--shadow);object-fit:cover}
.menu-btn{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:30;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,253,249,.92);box-shadow:var(--shadow);font-size:18px;color:var(--ink);cursor:pointer}
.menu{position:fixed;inset:0;z-index:40;background:rgba(75,63,56,.35);display:none}
.menu.on{display:block}
.menu nav{position:absolute;top:0;right:0;width:min(78vw,300px);height:100%;background:var(--card);padding:calc(24px + env(safe-area-inset-top)) 22px 24px;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.menu a{display:block;padding:13px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.menu .x{display:block;margin:0 0 10px auto;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}
header{text-align:center;padding:16px 0 4px}
h1{font-size:28px;font-weight:600;letter-spacing:.14em;margin-top:6px}
.handle{font-size:12px;letter-spacing:.28em;color:var(--muted);margin-top:2px}
.rule{width:28px;height:1px;background:var(--muted);margin:14px auto;opacity:.6}
.tag{font-size:14px;color:var(--ink);line-height:1.9}
.social{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}
.chip{display:inline-block;padding:7px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:600}
section{padding-top:40px;scroll-margin-top:14px}
section[hidden]{display:none}
h2{text-align:center;font-size:19px;font-weight:600;letter-spacing:.16em}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:2px 0 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.deal{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.deal .ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--butter),var(--rose));display:flex;align-items:center;justify-content:center;overflow:hidden}
.deal .ph img{width:100%;height:100%;object-fit:cover;display:block}
.deal .ph .ini{font-size:40px;color:#fff;opacity:.85}
.deal .bd{padding:12px 12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.deal .t{font-weight:600;font-size:14.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.pill{display:inline-flex;align-items:center;gap:5px;align-self:flex-start;background:var(--pill);color:#7a5c2e;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:600}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--terra)}
.btn{display:block;text-align:center;padding:10px 8px;border-radius:10px;background:var(--terra);color:#fff;text-decoration:none;font-weight:700;font-size:14px;margin-top:auto}
.btn:active{background:var(--terra-d)}
.btn.off{background:#eadfd2;color:var(--muted);pointer-events:none}
.empty{color:var(--muted);text-align:center;padding:26px 10px;background:var(--card);border:1px dashed var(--line);border-radius:16px;font-size:14px}
.rows{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.row:last-child{border-bottom:0}
.row .d{flex:0 0 46px;font-weight:700;font-size:13px;color:var(--terra)}
.row .n{flex:1;min-width:0;font-weight:600;font-size:14.5px}
.row .go{color:var(--muted);font-size:13px;white-space:nowrap}
.remind{flex:0 0 auto;background:var(--slate);color:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:700;text-decoration:none}
.more-btn{display:block;margin:4px auto 0;border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:8px}
details.mc{margin-top:14px}
details.mc summary{cursor:pointer;color:var(--muted);font-size:13px;text-align:center;list-style:none;padding:6px}
.ch{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px}
.ch button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 13px;font-size:15px;color:var(--ink);cursor:pointer}
.ch .m{font-weight:700}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{text-align:center;font-size:11px;color:var(--muted)}
.cell{min-width:0;min-height:58px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px;overflow:hidden}
.cell.out{opacity:.35}.cell.today{border-color:var(--terra);box-shadow:0 0 0 2px var(--terra) inset}
.cell .dn{font-size:10.5px;color:var(--muted)}
.cc{display:block;font-size:9.5px;line-height:1.25;border-radius:4px;padding:1px 3px;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:#f6dfae}
.cc.c1{background:#f3d3c4}.cc.c2{background:#d9e6cf}.cc.c3{background:#d6dff0}.cc.c4{background:#e6d6ea}
.ended .row{opacity:.92}
.ended .n{color:#7d6f66;font-weight:500}
.info{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:11px;margin-left:6px;cursor:pointer;background:none}
.note{display:none;background:var(--card);border-radius:12px;padding:12px 14px;font-size:13px;color:#6f6159;margin:0 0 12px;border:1px solid var(--line)}
.note.on{display:block}
.join{text-align:center}
.join .big{display:flex;gap:10px}
.join .big a{flex:1;padding:14px 8px;border-radius:12px;text-decoration:none;font-weight:700;color:#fff}
.join .l{background:#7fb59a}.join .i{background:var(--terra)}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;line-height:1.9}
footer a{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(75,63,56,.94);color:#fff;border-radius:12px;padding:10px 16px;font-size:13px;z-index:50;display:none;max-width:86vw;text-align:center}
.toast.on{display:block}
@media(max-width:340px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<button class="menu-btn" id="mb" aria-label="選單">☰</button>
<div class="menu" id="menu"><nav><button class="x" id="mx" aria-label="關閉">✕</button>
  <a href="#top">首頁</a><a href="#now">限時團購中</a><a href="#long">長期團購</a><a href="#cal">團購行事曆</a><a href="#ended">已結團找客服</a><a href="#join">加入社群</a></nav></div>
<div class="wrap" id="top">
  <div class="cover">
    <svg viewBox="0 0 400 210" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <g fill="none" stroke-linecap="butt">
        <path d="M40 210 A160 160 0 0 1 360 210" stroke="#e3b8a6" stroke-width="30"/>
        <path d="M70 210 A130 130 0 0 1 330 210" stroke="#efdcae" stroke-width="30"/>
        <path d="M100 210 A100 100 0 0 1 300 210" stroke="#9fb3ba" stroke-width="30"/>
      </g>
      <g fill="#fffdf9" opacity=".9"><circle cx="48" cy="38" r="4"/><circle cx="352" cy="52" r="3"/><circle cx="332" cy="22" r="2.5"/><circle cx="72" cy="70" r="2.5"/></g>
    </svg>
  </div>
  <img class="avatar" src="assets/logo.png" alt="Avolala" onerror="this.style.display='none'">
  <header>
    <h1 class="serif" id="name"></h1>
    <div class="handle" id="handle"></div>
    <div class="rule"></div>
    <div class="tag" id="tag"></div>
    <div class="social" id="social"></div>
  </header>

  <section id="now"><h2 class="serif">限時團購中</h2><p class="sub">現在開團中，想買的別錯過</p><div id="nowBox"></div></section>
  <section id="long" hidden><h2 class="serif">長期團購</h2><p class="sub">常駐好物，想買隨時可以下單</p><div class="rows" id="longBox"></div></section>
  <section id="cal"><h2 class="serif">團購行事曆</h2><p class="sub">按「設提醒」，開團那天提醒你</p><div id="calBox"></div>
    <details class="mc" id="mc"><summary>月曆檢視 ▾</summary><div id="month"></div></details></section>
  <section id="ended" hidden><h2 class="serif">已結團找客服 <button class="info" id="inf" aria-label="說明">i</button></h2><p class="sub">團購結束後，連結保留供查詢廠商客服資訊</p>
    <div class="note" id="infNote">團購已結束。若有訂單或商品問題，請透過各團購頁面上的廠商客服聯絡。</div>
    <div class="rows ended" id="endedBox"></div></section>
  <section id="join" class="join"><h2 class="serif">加入社群</h2><p class="sub">最新團購資訊，第一時間通知你</p><div class="big" id="joinBox"></div></section>
  <section id="more" hidden><h2 class="serif">更多推薦</h2><div class="rows" id="moreBox" style="margin-top:14px"></div></section>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>
<script>
const D = {"profile": {"name": "AVOLALA育兒頻道", "handle": "@avolala_select", "tagline": "Avolala 育兒頻道・團購選品\n團購商品請點下方連結", "email": "avolala1726@gmail.com"}, "social": [{"name": "Instagram", "url": "https://www.instagram.com/avolala_select"}, {"name": "官方 LINE", "url": "https://lin.ee/55lIYDJ"}, {"name": "LINE 社群", "url": "https://lin.ee/4tysQl6"}, {"name": "官網", "url": "https://www.avolala.com/"}], "shop": [{"name": "RICO baby濕紙巾", "url": "https://www.ricotw.com/xul1q5"}, {"name": "輕便推車", "url": "https://p4.groupbuyforms.tw/kb0cp"}, {"name": "Parakito法國帕洛 防蚊用品", "url": "https://p2.groupbuyforms.tw/mkm1h"}, {"name": "SiBRA無痕內衣褲", "url": "https://gbf.tw/1x4mh"}, {"name": "寶可夢相機", "url": "https://shop.labebe.tw/0ftg8"}, {"name": "Funny 三麗鷗兒童手機（相機/遊戲/拼圖/聽音樂）", "url": "https://shop.labebe.tw/qt2kw"}, {"name": "YABER 小影霸", "url": "https://enjoymentshops.com/IlSMk"}, {"name": "自拍棒", "url": "https://pickmebuy.com.tw/one/avolala%E9%81%B8%E5%93%81luvipod%E6%82%A0%E9%81%8A%E9%85%8D%E8%87%AA%E6%8B%8D%E8%85%B3%E6%9E%B6?rstrk=34c1250b38b291b80d3aee337f4d7996"}, {"name": "推車捲捲扇", "url": "https://guxon.my1shop.com/avolala_select"}, {"name": "🌟Roborock F25 ACE Pro / Ultra 旗艦洗地機", "url": "https://yoshikada.1shop-app.com/avolala_Roborock2"}, {"name": "🌟全自動奶瓶清洗機", "url": "https://yoshikada.1shop-app.com/avolala"}, {"name": "Arpha兒童牙刷出清🪥", "url": "https://yoshikada.1shop-app.com/avobaby"}, {"name": "✈️旅行配件組（折扣碼avolala88)", "url": "https://www.ekaxdesign.com/categories/avolala?sl-ref=avolala"}, {"name": "動物字卡&標籤機", "url": "https://www.avolala.com/one-page-stores/avolala-animals-card-1"}, {"name": "兔比媽咪", "url": "https://shop.labebe.tw/2u3jz", "auto": true}, {"name": "台東初鹿保久乳", "url": "https://gbf.tw/mnkzm", "auto": true}], "more": [{"name": "加入IG專區", "url": "https://www.instagram.com/channel/AbYperAz5Z-1Qd1f/"}, {"name": "蝦皮商品推薦", "url": "https://shpe.site/avolala"}, {"name": "eSIM 推薦", "url": "https://esimconnect.com.tw/#/access/esimbuy?referencecode=avolala_select"}, {"name": "Shopee ☺︎︎ 蝦皮", "url": "https://shopee.tw/indahmart"}, {"name": "Lıne ☺︎︎ 官方客服", "url": "https://lin.ee/pmJ7Uai"}], "events": [{"title": "Rico baby", "start": "2026-10-01", "end": "2026-10-06", "link": "https://www.ricotw.com/xul1q5", "cover": "assets/deals/rico.jpg"}, {"title": "兔比媽咪", "start": "2026-10-01", "end": "2026-10-07", "link": "https://shop.labebe.tw/2u3jz", "cover": "assets/deals/tobi.jpg"}, {"title": "初鹿保久乳", "start": "2026-10-01", "end": "2026-10-07", "link": "https://gbf.tw/mnkzm", "cover": "assets/deals/chulu.jpg"}], "built": "2026-10-02 23:51"};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayIso = iso(new Date());
const md = s => (+s.slice(5, 7)) + '/' + (+s.slice(8));

$('#name').textContent = D.profile.name; $('#handle').textContent = D.profile.handle;
$('#tag').innerHTML = esc(D.profile.tagline).replace(/\n/g, '<br>');
$('#social').innerHTML = D.social.map(s => `<a class="chip" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join('');

// 限時團購中：卡片（只顯示「開團中」，不顯示結團日）
const nowEv = D.events.filter(e => e.start <= todayIso && todayIso <= e.end);
const usedUrls = new Set(nowEv.map(e => e.link).filter(Boolean));
const card = e => `<div class="deal"><div class="ph">${e.cover ? `<img src="${esc(e.cover)}" alt="${esc(e.title)}" loading="lazy">` : `<span class="ini serif">${esc(e.title.trim().charAt(0))}</span>`}</div>
  <div class="bd"><div class="t">${esc(e.title)}</div><span class="pill">開團中</span>
  ${e.link ? `<a class="btn" href="${esc(e.link)}" target="_blank" rel="noopener">前往購買 →</a>` : `<a class="btn off">連結整理中</a>`}</div></div>`;
$('#nowBox').innerHTML = nowEv.length ? `<div class="grid2">${nowEv.map(card).join('')}</div>` : '<div class="empty">目前沒有進行中的限時團購<br>看看下方「團購行事曆」或「長期團購」</div>';

// 長期團購：沒有被限時卡片用到、也沒結團的團購連結
const longList = D.shop.filter(l => !l.ended && !usedUrls.has(l.url));
if (longList.length) { $('#long').hidden = false; $('#longBox').innerHTML = longList.map(l => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="n">${esc(l.name)}</span><span class="go">前往 →</span></a>`).join(''); }

// 團購行事曆：即將開團（只顯示開跑日）＋設提醒（.ics）
const up = D.events.filter(e => e.start > todayIso).sort((a, b) => a.start.localeCompare(b.start));
const ymd = s => s.replace(/-/g, '');
const nextDay = s => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + 1); return iso(d).replace(/-/g, ''); };
function icsHref(e) {
  const t = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Avolala//Link Page//ZH', 'BEGIN:VEVENT', 'UID:' + ymd(e.start) + '-' + encodeURIComponent(e.title) + '@avolala',
    'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART;VALUE=DATE:' + ymd(e.start), 'DTEND;VALUE=DATE:' + nextDay(e.start),
    'SUMMARY:Avolala 開團｜' + e.title, 'DESCRIPTION:' + (e.link ? e.link + '\\n' : '') + location.href.split('#')[0],
    'BEGIN:VALARM', 'TRIGGER:PT9H', 'ACTION:DISPLAY', 'DESCRIPTION:Avolala 開團提醒', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(t);
}
const calRow = e => `<div class="row"><span class="d">${md(e.start)}</span><span class="n">${esc(e.title)}</span><a class="remind" data-remind href="${icsHref(e)}" download="avolala-${ymd(e.start)}.ics">設提醒</a></div>`;
function renderUp(all) {
  const list = all ? up : up.slice(0, 5);
  $('#calBox').innerHTML = up.length ? `<div class="rows">${list.map(calRow).join('')}</div>` + (up.length > 5 && !all ? '<button class="more-btn" id="moreEv">看看更多活動 ▾</button>' : '') : '<div class="empty">目前沒有預告中的團購</div>';
  const mb = $('#moreEv'); if (mb) mb.onclick = () => renderUp(true);
}
renderUp(false);
document.addEventListener('click', ev => { if (ev.target.closest('[data-remind]')) toast('請在跳出的畫面按「加入」，開團那天早上會提醒你'); });

// 月曆檢視（折疊）
let cur = new Date(); cur.setDate(1);
function renderMonth() {
  const y = cur.getFullYear(), m = cur.getMonth(), first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  const colors = {}; let ci = 0; D.events.forEach(e => { if (!(e.title in colors)) colors[e.title] = 'c' + (ci++ % 5); });
  let h = `<div class="ch"><button id="pm">‹</button><div class="m">${y} 年 ${m + 1} 月</div><button id="nm">›</button></div><div class="grid7">`;
  '日一二三四五六'.split('').forEach(d => h += `<div class="dow">${d}</div>`);
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i); const k = iso(d);
    if (i >= 35 && d.getMonth() !== m) break;
    const es = D.events.filter(e => e.start <= k && k <= e.end);
    h += `<div class="cell${d.getMonth() !== m ? ' out' : ''}${k === todayIso ? ' today' : ''}"><div class="dn">${d.getDate()}</div>` +
      es.slice(0, 3).map(e => `<span class="cc ${colors[e.title]}">${esc(e.title)}</span>`).join('') + (es.length > 3 ? `<span class="cc">+${es.length - 3}</span>` : '') + '</div>';
  }
  $('#month').innerHTML = h + '</div>';
  $('#pm').onclick = () => { cur.setMonth(cur.getMonth() - 1); renderMonth(); };
  $('#nm').onclick = () => { cur.setMonth(cur.getMonth() + 1); renderMonth(); };
}
renderMonth();

// 已結團找客服
const endedList = D.shop.filter(l => l.ended);
if (endedList.length) { $('#ended').hidden = false; $('#endedBox').innerHTML = endedList.map(l => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="n">${esc(l.name)}</span><span class="go">已結團・找客服 →</span></a>`).join(''); }
$('#inf').onclick = () => $('#infNote').classList.toggle('on');

// 加入社群
const find = k => D.social.find(s => s.name.includes(k));
const jl = find('社群'), ji = find('Instagram');
$('#joinBox').innerHTML = (jl ? `<a class="l" href="${esc(jl.url)}" target="_blank" rel="noopener">LINE 社群</a>` : '') + (ji ? `<a class="i" href="${esc(ji.url)}" target="_blank" rel="noopener">Instagram</a>` : '');

// 更多推薦
if (D.more.length) { $('#more').hidden = false; $('#moreBox').innerHTML = D.more.map(l => `<a class="row" href="${esc(l.url)}" target="_blank" rel="noopener"><span class="n">${esc(l.name)}</span><span class="go">前往 →</span></a>`).join(''); }

$('#foot').innerHTML = `廠商合作：<a href="mailto:${esc(D.profile.email)}">${esc(D.profile.email)}</a><br>© ${new Date().getFullYear()} Avolala　資料更新：${esc(D.built)}`;

// 選單、提示
